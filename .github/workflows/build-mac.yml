name: Build macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyQt6 reportlab bcrypt pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --windowed
          --onedir
          --name church_app
          --add-data "assets/arrow_down.svg:assets"
          --add-data "area_code.txt:."
          church_app.py

      - name: Zip app bundle
        run: zip -r church_app_mac.zip dist/church_app.app

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          body: |
            ## 보스톤 한인 천주교 교적 관리 시스템 — ${{ github.ref_name }}

            ### 📥 다운로드 안내

            | 파일 | 운영체제 |
            |------|----------|
            | `church_app_windows.zip` | Windows 10 / 11 |
            | `church_app_mac.zip` | macOS 12 이상 |

            ### 🖥 Windows 설치 방법
            1. `church_app_windows.zip`을 다운로드하여 압축 해제합니다.
            2. `church_app` 폴더 안의 `church_app.exe`를 더블클릭하여 실행합니다.
            > Windows SmartScreen 경고가 뜨면 "추가 정보" → "실행"을 클릭하세요.

            ### 🍎 macOS 설치 방법
            1. `church_app_mac.zip`을 다운로드하여 압축 해제합니다.
            2. `church_app.app`을 더블클릭하여 실행합니다.
            > 처음 실행 시 "개발자를 확인할 수 없음" 경고가 뜨면: System Settings → Privacy & Security → "열기" 클릭

            ### ℹ️ 참고사항
            - 첫 실행 시 데이터베이스가 자동으로 생성됩니다.
            - 기본 관리자 계정: `admin` / `admin1234` (첫 로그인 후 반드시 변경하세요)
            - 업데이트 시 기존 데이터베이스 파일(`church_registry.db`)을 새 폴더에 복사하세요.
          files: church_app_mac.zip
